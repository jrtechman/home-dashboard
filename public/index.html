<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EAF0F5">
<script>(function(){try{var t=localStorage.getItem("hd_theme")||"auto";var d=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Home Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: wall-tablet app — slim light rail on the left, serif date header, one view at a time filling the screen; people get pastel columns that scroll sideways. Light by default, with a dark theme. */
:root{
  --bg:#FFFFFF;
  --rail:#EAF0F5;
  --rail-on:#FFFFFF;
  --ink:#1F2A33;
  --muted:#6B7883;
  --line:#E2E8ED;
  --chip:#F1F4F7;
  --accent:#2C78B5;
  --accent-ink:#FFFFFF;
  --card:#FFFFFF;
  --on-strong:#FFFFFF;
  --glass:rgba(255,255,255,.7);
  --glass-hi:rgba(255,255,255,.9);
  --banner:#FFF4D6; --banner-ink:#5A4300;
  --danger:#C2412B;
  --ok:#3E8E5E;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-col:34px; --r-item:22px;
  color-scheme:light;
}

/* Dark mode: same layout, deeper surfaces, softened pastels. Chosen per device (Auto follows the phone/tablet setting). */
:root[data-theme="dark"]{
  --bg:#141A21; --rail:#0E1318; --rail-on:#1C252E;
  --ink:#E8EDF1; --muted:#98A5B0; --line:#2B3640; --chip:#222B35;
  --accent:#5BA3DB; --accent-ink:#08131C;
  --on-strong:#0D1217;
  --card:#1C252E; --glass:rgba(28,37,46,.72); --glass-hi:rgba(22,29,37,.9);
  --danger:#EE8571; --ok:#6CC08B;
  --banner:#3A3015; --banner-ink:#F3DD9B;
  color-scheme:dark;
}
:root[data-theme="dark"] .c-amber{--strong:#E0933F;--tint:#2E2519;--soft:#43341F}
:root[data-theme="dark"] .c-teal{--strong:#6DBBBE;--tint:#1D2D2E;--soft:#28403F}
:root[data-theme="dark"] .c-coral{--strong:#F27B60;--tint:#36231F;--soft:#4C2F28}
:root[data-theme="dark"] .c-blue{--strong:#4A93D0;--tint:#1C2A38;--soft:#26394C}
:root[data-theme="dark"] .c-sage{--strong:#7DB06F;--tint:#222D20;--soft:#2F4029}
:root[data-theme="dark"] .c-lilac{--strong:#A18AD8;--tint:#28243A;--soft:#382F52}
:root[data-theme="dark"] .c-gold{--strong:#D9B73D;--tint:#302B17;--soft:#463E1F}
:root[data-theme="dark"] .c-none{--strong:#8D9BA6;--tint:#242A30;--soft:#313A42}
html,body{height:100%}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:84px 1fr;height:100%}

/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:stretch;padding-block:14px;padding-left:env(safe-area-inset-left,0px);gap:2px}
.mono{font-family:var(--display);font-size:28px;color:var(--muted);text-align:center;margin-block:6px 18px}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;font-size:13px;font-weight:500;color:var(--ink)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav[aria-current="page"]{background:var(--rail-on)}
.rail .spacer{flex:1}
.menu-btn{display:none}
.mrow{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 18px;border-radius:18px;background:var(--chip);font-weight:600;font-size:17px;text-align:left}
.mrow svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mrow .sub{margin-left:auto;font-weight:500;font-size:14px;color:var(--muted)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.top{display:flex;align-items:center;gap:18px;padding:16px 20px 10px 18px;flex-wrap:wrap}
.date{font-family:var(--display);font-size:34px;font-weight:500;letter-spacing:-.01em}
.time{font-family:var(--display);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.greet{color:var(--muted);font-size:15px}
.top .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#faceBtn{background:var(--card);border:1px solid var(--line)}
.calback{position:fixed;inset:0;z-index:59;background:rgba(31,42,51,.35)}
.calmenu.cmphone{left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:0;max-width:none;padding:10px 10px 12px;border-radius:26px}
.cmhead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 10px 14px;font-family:var(--serif,inherit);font-size:20px;font-weight:600}
.cmdone{min-height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink,#fff);font-weight:600;font-size:15px}
.calmenu.cmphone .cmrow{min-height:60px;font-size:17px}
@media (max-width:640px){ .top .tools .meta{display:none} }
@media (max-width:900px){
  .top .tools{flex-basis:100%;margin-left:0;flex-wrap:nowrap;gap:6px}
  .top .tools .meta{white-space:nowrap;font-size:14px}
  .top .tools #calBtn{margin-right:auto}
  .top .tools .pill{padding:0 14px;font-size:14px;flex:none}
  .top .tools .pill.icon{padding:0;width:44px;justify-content:center}
}
.calmenu{position:fixed;z-index:60;min-width:240px;max-width:calc(100vw - 24px);padding:8px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 40px rgba(31,42,51,.18)}
.cmrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 14px;border-radius:14px;text-align:left;font-weight:500;font-size:16px}
.cmrow:active{background:var(--chip)}
.cmrow .dot{width:14px;height:14px;border-radius:50%;background:var(--strong);flex:none}
.cmrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmrow .tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.cmrow .tick svg{width:16px;height:16px;stroke:var(--on-strong);stroke-width:3;fill:none;opacity:0}
.cmrow[aria-checked=true] .tick{background:var(--strong);border-color:var(--strong)}
.cmrow[aria-checked=true] .tick svg{opacity:1}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--chip);font-weight:500;font-size:15px}
.pill.icon{padding:0;width:44px;justify-content:center}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view{flex:1;min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.view[hidden]{display:none!important}

/* horizontal column boards */
.board{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 18px 16px;scroll-snap-type:x proximity}
.col{flex:0 0 280px;display:flex;flex-direction:column;min-height:0;border-radius:var(--r-col);background:var(--tint);padding:16px 16px 12px;scroll-snap-align:start}
.col-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--strong);color:var(--on-strong);display:grid;place-items:center;font-weight:600;font-size:18px;flex:none}
.col-name{font-family:var(--display);font-size:26px;line-height:1.1}
.count{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 14px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.count svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6}
.col-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.sec{font-family:var(--display);font-size:20px;margin:10px 4px 2px}
.item{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px 10px 18px;border-radius:var(--r-item);background:var(--soft);text-align:left;font-weight:600;font-size:16px;width:100%}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item .sub{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
.check{width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--card);flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(31,42,51,.06)}
.check svg{width:16px;height:16px;stroke:var(--on-strong);fill:none;stroke-width:3;opacity:0}
.item.done{opacity:.55}
.item.done .txt{text-decoration:line-through}
.item.done .check{background:var(--strong);border-color:var(--strong)}
.item.done .check svg{opacity:1}
.ex{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--glass);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.add-in{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:var(--r-item);border:2px dashed var(--soft);color:var(--muted);font-weight:600;width:100%}
.col-foot{display:flex;gap:8px;padding-top:6px}
.col-foot .pill{background:var(--glass);min-height:40px;font-size:14px}

/* calendar */
.cal .col{flex-basis:250px}
.cal .col.today{box-shadow:inset 0 0 0 3px var(--strong)}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:2px 4px 12px;width:100%;text-align:left}
.dayhead .dn{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.dayhead .dw{font-weight:600;font-size:15px}
.dayhead .tag{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--strong);color:var(--on-strong);padding:3px 10px;border-radius:999px}
.ev{display:flex;gap:12px;align-items:stretch;padding:12px 14px;border-radius:var(--r-item);background:var(--card);text-align:left;width:100%}
.ev .when{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;padding-top:2px}
.ev .what{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.ev .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--strong);flex:none}
.empty-day{color:var(--muted);font-size:14px;padding:8px 6px}

/* home */
.home{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr 1fr 1.25fr;gap:12px;padding:4px 18px 16px}
.home.noframe{grid-template-columns:1.05fr 1fr}
.card{border-radius:var(--r-col);background:var(--tint);padding:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 12px;text-wrap:balance}
.card .scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px;min-height:0}.stack>.card{flex:none}.stack .card .scroll{flex:none;overflow:visible}.stack>.todaycard .scroll{flex:1 1 0;overflow-y:auto}.pray{cursor:pointer}.pray .py{padding:3px 0;font-size:16px}.pray .py small{color:var(--muted);margin-left:6px}
.stack.left{display:flex;flex-direction:column}.stack.left>.card{flex:none}.stack.left>.todaycard{flex:1 1 0;min-height:140px}
.wx{cursor:pointer}
.wx .wxtop{display:flex;align-items:center;gap:14px}
.wx .wxt{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.wx .wxi{font-size:40px;line-height:1}
.wx .wxd{font-weight:600;font-size:16px}
.wx .wxs{color:var(--muted);font-weight:500;font-size:14px;margin-top:2px}
.wx .wear{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--glass);font-weight:600;font-size:15px;line-height:1.35}
.wx .wear small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:3px}
.verse{cursor:default}
.wxbody{display:flex;flex-direction:column;gap:12px;cursor:default}
.wxbody>*{flex:none}
.wx .wxmore{margin-top:8px;font-size:12px;color:var(--muted);font-weight:500}
.hourly{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.hr{flex:none;min-width:58px;text-align:center;padding:8px 6px;border-radius:14px;background:var(--chip)}
.hr .hl{font-size:12px;color:var(--muted);font-weight:600}.hr .hi{font-size:22px;margin:2px 0}.hr .ht{font-weight:700;font-variant-numeric:tabular-nums}.hr .hp{font-size:11px;color:var(--muted);min-height:14px}
.wdays{display:flex;flex-direction:column;gap:4px}
.wd{display:grid;grid-template-columns:minmax(0,1fr) 30px 44px auto;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--chip);font-weight:600;font-size:15px}
.wd .dp{font-size:12px;color:var(--muted);text-align:right}.wd .dt{font-variant-numeric:tabular-nums;text-align:right}
.wstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.wstat{padding:10px 12px;border-radius:14px;background:var(--chip)}.wstat .sl{font-size:12px;color:var(--muted);font-weight:600}.wstat .sv{font-weight:700;margin-top:2px}
.verse .vt{font-family:var(--display);font-size:15px;line-height:1.4;text-wrap:pretty}
.verse .vr{margin-top:8px;font-weight:600;font-size:14px;color:var(--muted)}
.verse .vr a{color:inherit}
.fam{padding:14px 20px}.fam h2{font-size:20px;margin:0 0 6px}
.rem{display:flex;align-items:center;gap:10px;padding:4px 0;font-weight:600;font-size:16px}.rem input{width:22px;height:22px;flex:none}.rem.done span.grow{text-decoration:line-through;opacity:.55}.meta.late{color:#C0503A;font-weight:700}
.cdrow{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:16px}.cdrow b{font-family:var(--display);font-weight:500;color:var(--strong)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.note{padding:14px;border-radius:16px}.note .nt{white-space:pre-wrap;word-break:break-word;font-size:16px}
.lrow{display:flex;align-items:center;gap:10px}
.lrow .lk{flex:1;min-width:0;display:flex;align-items:center;min-height:56px;padding:0 18px;border-radius:18px;background:var(--chip);font-weight:600;font-size:17px;color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcs{display:flex;flex-direction:column;gap:8px}
.camgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px}
.camtile{position:relative;display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;background:var(--chip);aspect-ratio:16/9;cursor:pointer}
.camtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camtile .cn{position:absolute;left:10px;bottom:10px;padding:5px 12px;border-radius:999px;background:var(--glass-hi);color:var(--ink);font-weight:600;font-size:14px}
.camtile .nopic{position:absolute;inset:0;display:grid;place-content:center;color:var(--muted);font-weight:500;font-size:14px;text-align:center;padding:10px}
.camlive{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000;display:block}
.cedit{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:18px;background:var(--chip)}


.dinner-title{font-family:var(--display);font-size:30px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.meta{color:var(--muted);font-weight:500;font-size:14px}
.frame{position:relative;border-radius:var(--r-col);overflow:hidden;background:var(--chip);min-height:0}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.2s ease}
.frame .cap{position:absolute;left:16px;bottom:16px;right:16px;display:flex;gap:8px;justify-content:flex-end}
.frame .cap .pill{background:var(--glass-hi)}
.frame-empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;color:var(--muted)}
.frame-empty strong{font-family:var(--display);font-weight:500;font-size:24px;color:var(--ink)}

/* meals */
.meals{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 90px;display:flex;flex-direction:column;gap:14px}
.tonight{border-radius:var(--r-col);background:var(--tint);padding:22px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lbl-s,.tonight .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tonight .dinner-title{font-size:36px;margin:2px 0}
.tonight .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tonight .pill{background:var(--card)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{border-radius:28px;background:var(--tint);padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:140px}
.rcard .rt{font-family:var(--display);font-size:22px;line-height:1.2;text-wrap:balance}
.rcard .meta{margin-top:auto}

.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.strip .dish{flex:0 0 200px;scroll-snap-align:start}
.dish{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1;border-radius:26px;overflow:hidden;background:var(--tint);text-align:left}
.dish img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish .lab{position:absolute;left:0;right:0;bottom:0;padding:32px 14px 12px;background:linear-gradient(transparent,rgba(20,26,31,.74));color:#fff}
.dish .rt{font-family:var(--display);font-size:20px;line-height:1.15;text-wrap:balance}
.dish .m{font-size:13px;margin-top:3px;opacity:.92}
.dish.noimg .lab{top:0;display:flex;flex-direction:column;justify-content:flex-end;background:none;color:var(--ink)}
.dish.noimg .m{color:var(--muted);opacity:1}
.dish .badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--glass-hi);color:var(--ink);font-size:12px;font-weight:700}
.dish .daytag{position:absolute;top:10px;left:10px;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}
.dish .daytag.past{background:var(--glass-hi);color:var(--muted)}
.dayrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dayrow input{flex:1 1 150px;min-width:0;min-height:48px;border-radius:14px;border:0;background:var(--chip);padding:0 14px}
.dish .badge svg{width:12px;height:12px;stroke:currentColor;stroke-width:3;fill:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.snap{display:grid;place-content:center;justify-items:center;gap:8px;aspect-ratio:1;max-width:100%;border-radius:26px;border:2px dashed var(--line);color:var(--muted);font-weight:600;text-align:center;padding:16px}
.snap svg{width:36px;height:36px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linejoin:round}
.hero{display:block;width:100%;max-width:100%;aspect-ratio:16/9;max-height:300px;object-fit:cover;border-radius:22px;background:var(--chip)}
.imp{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background:var(--chip)}
.imp textarea,.imp input{min-height:52px;border-radius:14px;border:0;background:var(--card);padding:12px 14px;font-size:16px}
.imp textarea{min-height:140px;resize:vertical;line-height:1.45}
.imp .hint{margin:0}
.srclink{color:var(--accent);font-weight:600;text-decoration:none}
.srclink:hover{text-decoration:underline}
.thumb{display:block;width:100%;height:130px;object-fit:cover;border-radius:20px;margin:8px 0 6px}
.tthumb{width:120px;height:120px;border-radius:22px;object-fit:cover;flex:none}

/* lists */
.lists{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 90px}
.addbar{display:flex;gap:8px;margin-bottom:14px;max-width:760px}
.addbar input{flex:1;min-width:0;min-height:56px;border-radius:999px;border:0;background:var(--chip);padding:0 22px;font-size:17px}
.addbar .pill{min-height:56px;background:var(--accent);color:var(--accent-ink);padding:0 24px}
.aisles{columns:280px;column-gap:12px}
.aisle{break-inside:avoid;margin-bottom:12px;border-radius:28px;background:var(--tint);padding:16px;display:flex;flex-direction:column;gap:8px}
.aisle h3{font-family:var(--display);font-weight:500;font-size:22px;margin:2px 4px 4px;display:flex;justify-content:space-between;align-items:baseline}
.aisle h3 span{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600}
.listfoot .grow{flex:1}
.ltabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding:2px 0 4px;scrollbar-width:none}
.ltabs::-webkit-scrollbar{display:none}
.ltab{flex:none;min-height:46px;padding:0 18px;border-radius:999px;background:var(--chip);font-weight:600;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.ltab .n{font-size:13px;font-weight:600;opacity:.65}
.ltab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.ltab.add{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.listfoot{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap;align-items:center}

/* photos */
.photos{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 90px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--chip);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:var(--glass-hi);display:grid;place-items:center}
.ph .x svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2.4;fill:none}
.hint{color:var(--muted);font-size:14px;line-height:1.5;max-width:60ch}

/* fab */
.fab{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(44,120,181,.35);z-index:5}
.fab svg{width:30px;height:30px;stroke:var(--accent-ink);stroke-width:2.4;fill:none;stroke-linecap:round}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(31,42,51,.28);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;z-index:20;padding:20px}
.sheet{box-sizing:border-box;background:var(--card);border-radius:30px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(31,42,51,.18)}
.sheet.wide{width:min(760px,100%)}
.sheet h2{font-family:var(--display);font-weight:500;font-size:30px;margin:0;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{min-height:52px;border-radius:16px;border:0;background:var(--chip);padding:12px 16px;font-size:17px}
.field textarea{min-height:120px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:140px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts .grow{flex:1}
.pill.primary{background:var(--accent);color:var(--accent-ink)}
.pill.danger{color:var(--danger)}
.pill.danger.solid{background:var(--danger);color:var(--on-strong)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;background:var(--chip);display:inline-flex;align-items:center;gap:8px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ing{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:16px;background:var(--chip)}
.ing span{flex:1;min-width:0}
.ing .pill{min-height:38px;background:var(--card);font-size:14px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;line-height:1.5;max-width:65ch}
.steps li::marker{font-family:var(--display);font-weight:600}
.cols2{display:grid;grid-template-columns:1fr 1.2fr;gap:22px}
.cols2 h3,.sheet h3{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 8px}
.swatches{display:flex;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;background:var(--strong)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.mem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:18px;background:var(--chip)}
.mem input{flex:1;min-width:120px;min-height:44px;border:0;border-radius:12px;padding:0 12px;background:var(--card)}

/* screensaver */
.saver{position:fixed;inset:0;z-index:30;background:#1F2A33;color:#fff;overflow:hidden}
.saver img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.6s ease}
.saver .veil{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(15,20,25,.65))}
.saver .clock{position:absolute;left:calc(40px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));right:40px}
.saver .big{font-family:var(--display);font-size:clamp(64px,11vw,140px);line-height:.95;font-variant-numeric:tabular-nums}
.saver .sd{font-family:var(--display);font-size:clamp(22px,3vw,34px);margin-top:6px}
.saver .nx{font-size:18px;margin-top:10px;opacity:.9}
.saver .noimg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,#2C4A63,#1F2A33 70%)}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.banner{margin:0 18px 8px;padding:10px 16px;border-radius:16px;background:var(--banner);color:var(--banner-ink);font-size:14px}

/* members' palettes, used as --strong / --tint / --soft */
.c-amber{--strong:#D9822B;--tint:#FAF1E7;--soft:#F3E2CF}
.c-teal{--strong:#5FA9AC;--tint:#EFF7F7;--soft:#DDEEEE}
.c-coral{--strong:#EE6648;--tint:#FDEFEB;--soft:#FADBD3}
.c-blue{--strong:#2C78B5;--tint:#E9F1F7;--soft:#D5E4F0}
.c-sage{--strong:#67985A;--tint:#EFF5EC;--soft:#DCEAD5}
.c-lilac{--strong:#8A72C6;--tint:#F3F0FA;--soft:#E3DCF3}
.c-gold{--strong:#C9A227;--tint:#FBF6E4;--soft:#F2E7BE}
.c-none{--strong:#7D8B96;--tint:#F3F6F8;--soft:#E4EAEF}

@media (max-width:900px){
  body{overflow:auto}
  .menu-btn{display:flex}
  .rail{gap:0}
  .nav[data-view=photos],#sleepBtn,#settingsBtn,#budgetBtn,#linksBtn,#camBtn,#histBtn,#famBtn{display:none}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;height:auto;min-height:100%}
  .main{min-width:0;max-width:100vw}
  .rail{order:2;flex-direction:row;position:sticky;bottom:0;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);overflow-x:auto;z-index:4}
  .mono,.rail .spacer{display:none}
  .nav{flex:1 0 64px;font-size:11px;padding:10px 0}
  .main{padding-left:max(0px,env(safe-area-inset-left,0px))}
  .top{padding-left:16px;padding-right:16px}
  .date{font-size:26px}.time{font-size:20px}
  .view{overflow:visible}
  .home,.home.noframe{grid-template-columns:1fr;padding-inline:16px}
  .frame{min-height:300px}
  .board{min-height:70vh;padding-inline:16px}
  .col{flex-basis:78vw}
  .meals,.lists,.photos{padding-inline:16px;overflow:visible}
  .cols2{grid-template-columns:1fr}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* Phones: "Our dishes" becomes a compact list (thumbnail, name, minutes). The dinner list strip keeps its photo tiles. */
@media (max-width:640px){
  .dgrid{display:flex;flex-direction:column;gap:8px}
  .dgrid .dish{display:flex;align-items:center;gap:12px;aspect-ratio:auto;min-height:72px;padding:8px 14px 8px 8px;border-radius:20px}
  .dgrid .dish img{position:static;flex:none;width:56px;height:56px;border-radius:14px}
  .dgrid .dish.noimg::before{content:"";flex:none;width:56px;height:56px;border-radius:14px;background:var(--soft)}
  .dgrid .dish .lab,.dgrid .dish.noimg .lab{position:static;flex:1;min-width:0;padding:0;background:none;color:var(--ink);display:block}
  .dgrid .dish .rt{font-size:18px}
  .dgrid .dish .m{color:var(--muted);opacity:1}
  .dgrid .dish .badge{position:static;order:3;flex:none;background:var(--chip)}
  .dgrid .snap{display:flex;align-items:center;justify-content:center;gap:10px;aspect-ratio:auto;min-height:60px;padding:12px;border-radius:20px}
  .dgrid .snap svg{width:26px;height:26px}
}
/* Phones: tighter lists */
@media (max-width:640px){
  .lists{padding-inline:12px}
  .addbar{margin-bottom:8px;gap:6px}
  .addbar input{min-height:48px;font-size:16px;padding:0 18px}
  .addbar .pill{min-height:48px;padding:0 20px}
  .listfoot{margin:0 0 8px;gap:6px}
  .listfoot .pill{min-height:38px;font-size:13px;padding:0 14px}
  .ltabs{margin-bottom:8px}
  .ltab{min-height:40px;padding:0 14px;font-size:14px}
  .aisles{column-gap:8px}
  .aisle{margin-bottom:8px;padding:10px 10px 8px;gap:4px;border-radius:22px}
  .aisle h3{font-size:17px;margin:0 4px 2px}
  .aisle h3 span{font-size:12px}
  .aisle .item{min-height:42px;padding:6px 8px 6px 14px;border-radius:14px;font-size:15px;gap:8px}
  .aisle .item .check{width:26px;height:26px}
  .aisle .item .check svg{width:14px;height:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* sign-in */
.login{position:fixed;inset:0;z-index:60;background:var(--rail);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px}
.login form{box-sizing:border-box;background:var(--card);border-radius:30px;padding:32px;width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.login h1{font-family:var(--display);font-weight:500;font-size:34px;margin:0}
.login input{min-height:60px;border-radius:18px;border:0;background:var(--chip);padding:0 20px;font-size:22px;letter-spacing:.1em}
.login .pill{min-height:56px;justify-content:center;font-size:17px}
.err{color:var(--danger);font-weight:600;font-size:14px;min-height:1.2em}

/* budget */
.bud{display:flex;flex-direction:column;gap:12px}
.brow .bh{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.brow .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--glass);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--strong)}
.brow.over .amt{color:var(--danger)}
.brow.over .bar i{background:var(--danger)}
.sheet .bar{background:var(--chip)}.sheet .bar i{background:#5FA9AC}
.bud.all{max-height:58vh;overflow-y:auto;padding-right:4px}.brow.plain{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-height:36px}.bud.all{gap:10px}.bud.all input{width:20px;height:20px;flex:none}#homeBudget{cursor:pointer}
.bchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.bchip.over{color:var(--danger)}
.ev.ext{background:var(--glass)}
.ev .src{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="mono" id="mono" aria-hidden="true">H</div>
    <button class="nav" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button class="nav" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
    <button class="nav" data-view="tasks"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Tasks</button>
    <button class="nav" data-view="meals"><svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 005 0V3M7 11v10M17 21V3c-2.5 1-3.5 4-3.5 7.5V13H17"/></svg>Meals</button>
    <button class="nav" data-view="lists"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>Lists</button>
    <button class="nav" data-view="photos"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8.5"/></svg>Photos</button>
    <button class="nav menu-btn" id="menuBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
    <div class="spacer"></div>
    <button class="nav" id="budgetBtn"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h3"/></svg>Budget</button>
    <button class="nav" id="histBtn"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 108.5-8.5A8.5 8.5 0 005.6 6.3L3.5 8.5"/><path d="M3.5 4v4.5H8M12 7.5V12l3 2"/></svg>Meal history</button>
    <button class="nav" id="famBtn"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0111 0M16 6.5a2.6 2.6 0 010 5M17.5 14a5 5 0 013 5"/></svg>Family</button>
    <button class="nav" id="camBtn"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="M16 11l5-3v8l-5-3"/></svg>Cameras</button>
    <button class="nav" id="linksBtn"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>Links</button>
    <button class="nav" id="sleepBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>Sleep</button>
    <button class="nav" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
  </nav>

  <main class="main">
    <header class="top">
      <div class="date" id="date">Tuesday, Oct 20</div>
      <div class="time" id="time">12:00 PM</div>
      <div class="greet" id="greet"></div>
      <div class="tools" id="tools"></div>
    </header>
    <div id="banner" class="banner" hidden></div>

    <section class="view" data-name="home">
      <div class="home">
        <div class="stack left">
          <div class="card c-sage wx" id="homeWx"></div>
          <div class="card c-teal fam" id="homeFam" style="display:none"></div>
          <div class="card c-blue todaycard"><h2 id="todayTitle">Today</h2><div class="scroll" id="homeToday"></div></div>
        </div>
        <div class="stack">
          <div class="card c-amber" id="homeDinner"></div>
          <div class="card c-sage" id="homeTasksCard"><h2>Open tasks</h2><div class="scroll" id="homeTasks"></div></div>
          <div class="card c-blue pray" id="homePrayer" style="display:none"></div>
          <div class="card c-teal" id="homeBudget" hidden></div>
          <div class="card c-amber verse" id="homeVerse"></div>
        </div>
        <div class="frame" id="frame"></div>
      </div>
    </section>

    <section class="view" data-name="calendar"><div class="board cal" id="calBoard"></div></section>
    <section class="view" data-name="tasks"><div class="board" id="taskBoard"></div></section>
    <section class="view" data-name="meals"><div class="meals" id="meals"></div></section>
    <section class="view" data-name="lists"><div class="lists" id="lists"></div></section>
    <section class="view" data-name="photos"><div class="photos" id="photos"></div></section>
  </main>
</div>

<button class="fab" id="fab" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheetHost"></div>
<div id="saver" class="saver" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="dishIn" accept="image/*" capture="environment" hidden>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h1>Home Dashboard</h1>
    <p class="hint" style="margin:0">Enter the household passcode. This screen stays signed in.</p>
    <input class="vh" type="text" name="username" value="household" autocomplete="username" tabindex="-1" aria-hidden="true">
    <input id="passIn" type="password" name="password" autocomplete="current-password" aria-label="Household passcode" placeholder="Passcode">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="pill primary" type="submit">Sign in</button>
    <button class="pill" type="button" id="faceBtn" hidden>Unlock with Face ID</button>
  </form>
</div>

<script>
(function(){
"use strict";

function clothing(w){

  const ref=Number.isFinite(cur)&&Number.isFinite(hi)?(cur+hi)/2:(Number.isFinite(cur)?cur:hi);
  let main, extra=[];
  if(!Number.isFinite(ref)) return null;
  if(ref<=20) main="Heavy winter coat, hat and gloves";
  else if(ref<=35) main="Winter coat, hat and gloves";
  else if(ref<=48) main="Warm jacket";
  else if(ref<=60) main="Light jacket or a sweater";
  else if(ref<=70) main="Long sleeves, maybe a light layer";
  else if(ref<=82) main="T-shirt weather";
  else main="Light, breathable clothes";
  if(snow){ extra.push("snow boots"); if(ref>35) main="Warm coat"; }

}

const MODULES=[
  ["Home page",[["weather","Weather and what to wear"],["verse","Verse of the day"],["dinner","Tonight's dinner card"],["tasks_card","Open tasks card"],["budget_card","Budget card"],["photoframe","Photo frame"]]],
  ["Tabs",[["calendar","Calendar"],["tasks","Tasks"],["meals","Meals"],["lists","Lists"],["photos","Photos"]]],
  ["Family",[["reminders","Recurring reminders"],["countdowns","Countdowns"],["notes","Family notes"],["prayer","Prayer list"]]],
  ["Menu and extras",[["budget","Budget screen"],["history","Meal history"],["cameras","Cameras"],["links","Helpful links"],["sleep","Photo screensaver button"],["askhelp","Ask for help button (Meals)"]]],
];
function mod(id){ return ((S.settings&&S.settings.modules)||{})[id]!==false; }
function applyModules(){
  const show=(el,on)=>{ if(el) el.style.display=on?"":"none"; };
  ["calendar","tasks","meals","lists","photos"].forEach(v=>document.querySelectorAll('.nav[data-view="'+v+'"]').forEach(b=>show(b,mod(v))));
  show($("#famBtn"),mod("reminders")||mod("countdowns")||mod("notes")||mod("prayer")); show($("#budgetBtn"),mod("budget")); show($("#histBtn"),mod("history")); show($("#camBtn"),mod("cameras")); show($("#linksBtn"),mod("links")); show($("#sleepBtn"),mod("sleep"));
  show($("#homeWx"),mod("weather")); show($("#homeVerse"),mod("verse")); show($("#homeDinner"),mod("dinner")); show($("#homeTasksCard"),mod("tasks_card")); show($("#frame"),mod("photoframe"));
  const home=document.querySelector(".home"); if(home) home.classList.toggle("noframe",!mod("photoframe"));
  if(["calendar","tasks","meals","lists","photos"].includes(S.view)&&!mod(S.view)) setView("home");
  if(mod("weather")&&S.settings.place&&!S.weather&&!S.wxBusy&&Date.now()-(S.wxAt||0)>60000){ S.wxBusy=true; pullWeather().finally(()=>{S.wxBusy=false;}); }
  if(mod("verse")&&!S.verse&&!S.verseBusy&&Date.now()-(S.verseAt||0)>60000){ S.verseBusy=true; pullVerse().finally(()=>{S.verseBusy=false;}); }
}
function adminSection(){
  const box=h("div",null,h("h3",null,"Admin")), body=h("div",{style:"display:flex;flex-direction:column;gap:8px"}); box.append(body);
  const post=async(b)=>api("/api/admin",{method:"POST",body:JSON.stringify(b)});
  const draw=async()=>{
    body.replaceChildren(); let st={admin:false,hasPasscode:true,fromEnv:false};
    try{ st=await api("/api/admin"); }catch(e){}
    S.admin=!!st.admin;
    if(!st.admin){
      const pw=h("input",{type:"password",id:"admPw",autocomplete:st.hasPasscode?"current-password":"new-password",placeholder:st.hasPasscode?"Admin passcode":"Choose an admin passcode (6+ characters)"});
      const go=async()=>{ try{ await post({op:st.hasPasscode?"unlock":"setup",passcode:pw.value}); toast(st.hasPasscode?"Admin unlocked on this device":"Admin passcode set. This device is now admin."); draw(); }catch(e){ toast(e.message||"Couldn't unlock."); } };
      pw.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
      body.append(h("p",{class:"hint",style:"margin:0"},st.hasPasscode?"Only an admin can choose which features are on. Enter the admin passcode to unlock this device.":"Only an admin can choose which features are on. Set a separate admin passcode now. Do this yourself first, before others open Settings."),pw,h("div",{class:"acts"},h("button",{class:"pill primary",onclick:go},st.hasPasscode?"Unlock admin":"Set admin passcode")));
      return;
    }
    body.append(h("div",{class:"acts"},h("span",{class:"meta grow"},"Admin is unlocked on this device."),h("button",{class:"pill",onclick:async()=>{ try{ await post({op:"lock"}); }catch(e){} draw(); }},"Lock")));
    body.append(h("p",{class:"hint",style:"margin:0"},"Switch features on or off for every screen. Turning one off only hides it; nothing is deleted."));
    MODULES.forEach(([group,items])=>{
      body.append(h("h3",{style:"margin:6px 0 0;font-size:15px"},group));
      items.forEach(([id,label])=>{
        const c=h("input",{type:"checkbox"}); c.checked=mod(id);
        c.addEventListener("change",async()=>{ const next={...(S.settings.modules||{})}; if(c.checked) delete next[id]; else next[id]=false; await saveSettings({modules:next}); });
        body.append(h("label",{style:"display:flex;gap:10px;align-items:center;font-weight:600"},c,label));
      });
    });
    if(!st.fromEnv){
      const cur=h("input",{type:"password",placeholder:"Current admin passcode",autocomplete:"current-password"}), nw=h("input",{type:"password",placeholder:"New admin passcode (6+ characters)",autocomplete:"new-password"});
      body.append(h("h3",{style:"margin:6px 0 0;font-size:15px"},"Change admin passcode"),cur,nw,h("div",{class:"acts"},h("button",{class:"pill",onclick:async()=>{ try{ await post({op:"change",passcode:cur.value,newPasscode:nw.value}); cur.value=""; nw.value=""; toast("Admin passcode changed"); }catch(e){ toast(e.message||"Couldn't change it."); } }},"Change passcode")));
    }
  };
  draw(); return box;
}
function renderAll(){
  $("#mono").textContent=(S.settings.household||"H").trim()[0]?.toUpperCase()||"H";
  renderHome(); renderCal(); renderTasks(); renderMeals(); renderLists(); renderPhotos(); renderBudget(); renderFam(); renderPrayer(); applyModules();
